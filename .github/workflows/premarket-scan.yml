name: premarket-scan

# GitHub cron is UTC only. These four slots cover ~8:05 ET in both EDT and EST;
# scan.py only proceeds between 7:50 and 9:25 ET and only once per day, so the
# extra slots act as retries if a run is delayed or Yahoo rate-limits.
on:
  schedule:
    - cron: "5 12 * * 1-5"
    - cron: "35 12 * * 1-5"
    - cron: "5 13 * * 1-5"
    - cron: "35 13 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: premarket-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scan
        run: python scan.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Commit results
        if: always()
        run: |
          git config user.name "pairs-scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A signals pair_health.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "scan $(TZ=America/New_York date +%F)"
            git pull --rebase
            git push
          fi
